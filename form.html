<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaporIn - Buat Laporan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { telkom: { 500: '#dc2626', 600: '#b91c1c', 700: '#991b1b' } } } }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Navigasi -->
    <nav class="relative bg-cover bg-center text-white shadow-lg sticky top-0 z-50" style="background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1920&auto=format&fit=crop');">
        <div class="absolute inset-0 bg-gradient-to-r from-telkom-700/90 to-slate-900/70"></div>
        <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0">
                    <a href="index.html" class="flex items-center gap-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                        <span class="font-bold text-xl tracking-wide">LaporIn</span>
                    </a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="index.html" class="hover:bg-white/10 px-3 py-2 rounded-md text-sm font-medium transition-all">Dashboard</a>
                        <a href="form.html" class="bg-white/20 backdrop-blur-sm px-3 py-2 rounded-md text-sm font-medium border border-white/50">Buat Laporan Baru</a>
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button type="button" id="mobile-menu-btn" class="inline-flex items-center p-2 rounded-md hover:bg-white/20">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="md:hidden hidden relative z-10" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-slate-900/90 backdrop-blur-md">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-white/10">Dashboard</a>
                <a href="form.html" class="block px-3 py-2 rounded-md text-base font-medium bg-white/20 border-l-4 border-telkom-500">Buat Laporan Baru</a>
            </div>
        </div>
    </nav>

    <!-- Konten Form -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
        <!-- Container notifikasi pesan validasi -->
        <div id="notif-pesan" style="display: none;" class="mb-4 p-4 rounded-lg font-medium text-sm"></div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-5">
                <h2 class="text-xl font-bold text-slate-800">Formulir Laporan Kerusakan</h2>
                <p class="text-sm text-slate-500 mt-1">Isi formulir ini dengan detail agar teknisi dapat segera menindaklanjuti.</p>
            </div>
            
            <form id="form-laporan" action="#" method="POST" class="px-6 py-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="nama_pelapor" class="block text-sm font-medium text-slate-700 mb-1">Nama Pelapor</label>
                        <input type="text" id="nama_pelapor" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-telkom-500 focus:border-telkom-500 outline-none transition-all" placeholder="Masukkan nama lengkap">
                    </div>
                    <div>
                        <label for="lokasi" class="block text-sm font-medium text-slate-700 mb-1">Lokasi Ruangan</label>
                        <input type="text" id="lokasi" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-telkom-500 focus:border-telkom-500 outline-none transition-all" placeholder="Cth: Ruang Kelas B, Gedung 4">
                    </div>
                </div>

                <div>
                    <label for="kategori" class="block text-sm font-medium text-slate-700 mb-1">Kategori Fasilitas</label>
                    <select id="kategori" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-telkom-500 focus:border-telkom-500 outline-none bg-white">
                        <option>Elektronik (AC, Proyektor, Lampu)</option>
                        <option>Mebel (Meja, Kursi, Papan Tulis)</option>
                        <option>Sanitasi (Toilet, Wastafel)</option>
                        <option>Lainnya</option>
                    </select>
                </div>

                <div>
                    <label for="deskripsi" class="block text-sm font-medium text-slate-700 mb-1">Deskripsi Kerusakan</label>
                    <textarea id="deskripsi" rows="4" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-telkom-500 focus:border-telkom-500 outline-none transition-all resize-none" placeholder="Ceritakan detail kerusakan yang terjadi..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Unggah Foto Bukti</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-300 border-dashed rounded-lg hover:border-telkom-500 transition-colors">
                        <div class="space-y-1 text-center">
                            <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48"><path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <div class="flex text-sm text-slate-600 justify-center">
                                <label for="foto_bukti" class="relative cursor-pointer bg-white rounded-md font-medium text-telkom-600 hover:text-telkom-500 focus-within:outline-none">
                                    <span>Pilih file foto</span>
                                    <input id="foto_bukti" name="foto_bukti" type="file" class="sr-only">
                                </label>
                                <p class="pl-1">atau seret ke sini</p>
                            </div>
                            <p class="text-xs text-slate-500">PNG, JPG up to 5MB</p>
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
                    <a href="index.html" class="px-5 py-2.5 bg-white border border-slate-300 rounded-lg text-slate-700 font-medium hover:bg-slate-50 transition-colors">Batal</a>
                    <button type="submit" class="px-5 py-2.5 bg-telkom-600 rounded-lg text-white font-medium hover:bg-telkom-700 shadow-sm transition-colors">Kirim Laporan</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-slate-800 text-slate-400 py-6 text-center mt-12">
        <p class="text-sm">&copy; 2026 LaporIn</p>
    </footer>

    <!-- Pemanggilan Library & Script -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
