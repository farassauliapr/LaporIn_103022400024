<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaporIn - Buat Laporan Baru</title>
</head>
<body>

    <header>
        <h1>LaporIn</h1>
        <p>Platform Pengaduan Fasilitas Kampus</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Daftar Pengaduan</a></li>
            <li><a href="form.html">Buat Laporan Baru</a></li>
        </ul>
    </nav>

    <main>
        <h2>Formulir Laporan Kerusakan Fasilitas</h2>
        <p>Silakan isi form di bawah ini dengan lengkap untuk melaporkan fasilitas kampus yang rusak.</p>
        
        <form action="#" method="POST">
            <p>
                <label for="nama_pelapor">Nama Pelapor:</label><br>
                <input type="text" id="nama_pelapor" name="nama_pelapor" placeholder="Masukkan nama Anda">
            </p>

            <p>
                <label for="lokasi">Lokasi Ruangan/Gedung:</label><br>
                <input type="text" id="lokasi" name="lokasi" placeholder="Contoh: Ruang Kelas B, Gedung 4">
            </p>

            <p>
                <label for="kategori_fasilitas">Kategori Fasilitas:</label><br>
                <select id="kategori_fasilitas" name="kategori_fasilitas">
                    <option value="elektronik">Elektronik (AC, Proyektor, Lampu)</option>
                    <option value="mebel">Mebel (Meja, Kursi, Papan Tulis)</option>
                    <option value="sanitasi">Sanitasi (Toilet, Wastafel, Air)</option>
                    <option value="lainnya">Lain-lain</option>
                </select>
            </p>

            <p>
                <label for="deskripsi_kerusakan">Deskripsi Kerusakan:</label><br>
                <textarea id="deskripsi_kerusakan" name="deskripsi_kerusakan" rows="5" cols="40" placeholder="Jelaskan secara detail bagian mana yang rusak..."></textarea>
            </p>

            <p>
                <label for="foto_bukti">Unggah Foto Bukti:</label><br>
                <input type="file" id="foto_bukti" name="foto_bukti" accept="image/*">
            </p>

            <p>
                <button type="submit">Kirim Laporan</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 LaporIn - Tugas Pemrograman Web Week 2</p>
    </footer>

</body>
</html>
